name: Trail photos
# After picked photos are merged (packages/core/data/trail-photos.json), builds the ones not yet on
# R2 from Wikimedia Commons and uploads them to the tiles bucket under photos/ (served at
# tiles.trailaroo.com/photos). Each photo's name changes with the pick, so it's cached for a year.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [packages/core/data/trail-photos.json]

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUCKET: trailaroo-tiles
      OUT: .data/photo-build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:photos --build "$OUT"
      - name: Upload to R2
        if: hashFiles('.data/photo-build/**') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't support the newer default checksums in AWS CLI v2.23+.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp "$OUT/photos" "s3://$BUCKET/photos" --recursive --endpoint-url "$ENDPOINT" \
            --content-type image/jpeg --cache-control "public, max-age=31536000, immutable"
