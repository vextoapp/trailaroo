name: Trail data refresh
# Rebuilds packages/core/data/trails.json from the latest OpenStreetMap extract every night and opens
# (or updates) a PR when trails change, so a person reviews every data change. A failed run opens an
# issue. Free for public repos; downloads about 1 GB from Geofabrik a night, CAPAD and terrain are cached.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *" # 3–4am in Canberra

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # to start CI on the PR branch

defaults:
  run:
    shell: bash # an explicit bash adds pipefail, so a failed rebuild piped into tee still fails the step

env:
  BRANCH: data/nightly-refresh
  TRAILS: packages/core/data/trails.json
  MAX_DROP: "0.1" # fail if more than 10% of yesterday's trails vanish in one night: that's a broken extract, not real edits

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Cache CAPAD park boundaries
        id: capad
        uses: actions/cache@v4
        with:
          path: .data/capad
          key: capad-2024-terrestrial
      - name: Download CAPAD (only when not cached)
        if: steps.capad.outputs.cache-hit != 'true'
        run: |
          mkdir -p .data/capad
          curl -sSfL "https://fed.dcceew.gov.au/api/download/v1/items/ec356a872d8048459fe78fc80213dc70/geojson?layers=0" -o .data/capad/capad-2024-terrestrial.geojson
      - name: Cache terrain tiles
        uses: actions/cache@v4
        with:
          path: .data/terrain
          key: terrain-${{ github.run_id }}
          restore-keys: terrain-
      - name: Download OpenStreetMap extract
        # -R keeps Geofabrik's timestamp, which becomes the file's importedAt.
        run: curl -sSfL -R https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf -o .data/australia-latest.osm.pbf
      - name: Rebuild trails
        run: |
          cp "$TRAILS" .data/trails-before.json
          pnpm data:trails | tee .data/trails.log
      - name: Check the rebuild
        run: |
          before=$(jq '.trails | length' .data/trails-before.json)
          after=$(jq '.trails | length' "$TRAILS")
          # Count trails that disappeared, so new trails can't hide lost ones.
          gone=$(jq -n --slurpfile a .data/trails-before.json --slurpfile b "$TRAILS" \
            '($b[0].trails | map(.osmId)) as $now | [$a[0].trails[] | select(.osmId as $id | $now | index($id) | not)] | length')
          echo "Trails: $before before, $after after, $gone gone"
          if [ "$(jq -n "$gone > $before * $MAX_DROP")" = true ]; then
            echo "::error::$gone of $before trails vanished in one night; the extract is probably broken."
            exit 1
          fi
          pnpm test
      - name: Compare with the current data
        run: |
          # The import date changes every night; only a change to the trails themselves is worth a PR.
          # With nothing left to change, the PR step below closes any open data PR, which is now out of date.
          if [ "$(jq -c 'del(.importedAt)' .data/trails-before.json)" = "$(jq -c 'del(.importedAt)' "$TRAILS")" ]; then
            echo "No trail changes."
            git checkout -- "$TRAILS" packages/core/data/trail-ids.json
            echo "No trail changes since this PR was opened; closing it." > .data/pr-body.md
            exit 0
          fi
          jq -rn --slurpfile a .data/trails-before.json --slurpfile b "$TRAILS" '
            def byId(f): f.trails | map({key: (.osmId | tostring), value: .}) | from_entries;
            byId($a[0]) as $A | byId($b[0]) as $B |
            def names(ks; m): [ks[] | "- " + m[.].name] | if length == 0 then ["- none"] else . end | join("\n");
            "Nightly rebuild from OpenStreetMap (extract dated \($b[0].importedAt)). Review before merging.\n",
            "**Trails:** \($A | length) → \($B | length)\n",
            "### Added\n" + names([$B | keys[] | select($A[.] == null)]; $B) + "\n",
            "### Removed\n" + names([$A | keys[] | select($B[.] == null)]; $A) + "\n",
            "### Changed\n" + names([$B | keys[] | select($A[.] != null and $A[.] != $B[.])]; $B) + "\n"
          ' > .data/pr-body.md
          {
            echo "### Left out for gaps in the map data"
            grep '^Left out for gaps' .data/trails.log | sed 's/^Left out for gaps in the map data: //'
            echo
            echo "### Published-length check"
            pnpm --silent data:check 2>&1 | tail -1 || true
          } >> .data/pr-body.md
          cat .data/pr-body.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.BRANCH }}
          delete-branch: true # closes the PR when the rebuild matches main again
          add-paths: |
            ${{ env.TRAILS }}
            packages/core/data/trail-ids.json
          commit-message: "Trail data: nightly rebuild from OpenStreetMap"
          title: "Trail data: nightly rebuild from OpenStreetMap"
          body-path: .data/pr-body.md
      - name: Run CI on the PR
        # PRs opened with the workflow token don't trigger CI by themselves; a dispatch does.
        # Any open data PR, so a re-run also recovers a CI start that failed last time.
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$BRANCH"
      - name: Raise an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Nightly trail data refresh failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The nightly rebuild failed: $RUN_URL. The live trail data is unchanged. Check the run log, fix, then re-run the workflow."
          fi
