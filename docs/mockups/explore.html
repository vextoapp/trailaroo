<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore mock-up</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockups.css">
<script src="mockups.js"></script>
<script src="data.js"></script>
<script src="trail-helpers.js"></script>
<style>
  .ex-top { position: sticky; top: 0; z-index: 12; background: var(--bg); padding-top: var(--space-4); }
  @media (min-width: 1024px) { .ex-top { top: 69px; } }
  .ex-split { display: grid; gap: var(--space-6); padding: var(--space-5) 0 140px; }
  .ex-map { position: relative; height: 70vh; border-radius: var(--radius-m); }
  .ex-map img { width: 100%; height: 100%; object-fit: cover; }
  body:not([data-view="map"]) .ex-map { display: none; }
  body[data-view="map"] .results { display: none; }
  @media (min-width: 1100px) {
    .ex-split { grid-template-columns: minmax(0, 1fr) 40%; align-items: start; }
    body[data-view] .ex-map { display: block; position: sticky; top: 200px; height: calc(100dvh - 230px); }
    body[data-view] .results { display: block; }
    .float-switch { display: none; }
  }
</style>
</head>
<body data-screen="explore" data-view="list">
<a class="skip" href="#main">Skip to content</a>
<nav class="nav" aria-label="Main"></nav>
<main id="main" class="page">
  <h1 class="visually-hidden">Explore trails</h1>
  <div class="ex-top">
    <form class="finder" role="search" action="explore.html">
      <label><b>Where</b><input type="search" name="q" placeholder="Near Canberra" autocomplete="off"></label>
      <label><b>How long</b><input type="text" name="len" placeholder="Any length" autocomplete="off"></label>
      <label><b>Who's coming</b><input type="text" name="who" placeholder="Just me" autocomplete="off"></label>
      <button class="go" type="submit" aria-label="Search"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-search"/></svg></button>
    </form>
    <div class="cats" role="group" aria-label="Activity" data-single>
      <button type="button" class="chip-cat" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-explore"/></svg>All trails</button>
      <button type="button" class="chip-cat" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#f-foot"/></svg>Walks</button>
      <button type="button" class="chip-cat" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#f-bike"/></svg>Bike trails</button>
    </div>
    <div class="chips" role="group" aria-label="Length" data-single style="padding-top: var(--space-3)">
      <button type="button" class="chip" aria-pressed="true">Any length</button>
      <button type="button" class="chip" aria-pressed="false">Under 5 km</button>
      <button type="button" class="chip" aria-pressed="false">5 to 15 km</button>
      <button type="button" class="chip" aria-pressed="false">Over 15 km</button>
    </div>
    </div>
  </div>
  <div class="ex-split">
    <section class="results" aria-labelledby="ex-h" data-text-version>
      <h2 id="ex-h" class="meta num" style="font: 500 var(--step-0) var(--font-sans); margin-bottom: var(--space-4)"></h2>
      <div class="cards" id="ex-cards"></div>
      <p style="margin-top: var(--space-6); text-align: center"><button type="button" class="btn">Show 24 more</button></p>
      <p class="credit" style="margin-top: var(--space-5)">Trail data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors. Photos from Wikimedia Commons; time and difficulty are sample values.</p>
    </section>
    <div class="ex-map map" role="region" aria-label="Map of trails near Canberra. The list shows the same trails as text." data-focus-on="view=map" tabindex="-1">
      <img class="map-img" data-themed-map="act" alt="">
      <p class="attribution">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Protomaps</p>
    </div>
  </div>
  <div class="segmented float-switch" role="group" aria-label="Show results as">
    <button type="button" data-set="view=list" aria-pressed="true"><svg class="icon-s" aria-hidden="true"><use href="icons.svg#i-list"/></svg>List</button>
    <button type="button" data-set="view=map" aria-pressed="false"><svg class="icon-s" aria-hidden="true"><use href="icons.svg#i-map"/></svg>Map</button>
  </div>
</main>
<script>
  const { T, fillPhotos } = window.Dir;
  document.getElementById("ex-h").textContent = `${T.length} of 37 trails near Canberra (sample)`;
  document.getElementById("ex-cards").innerHTML = T.map(window.cardHtml).join("");
  fillPhotos();
</script>
</body>
</html>
